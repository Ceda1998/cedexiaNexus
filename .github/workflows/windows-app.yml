name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-app.yml
      - nexus_ui/**
      - scripts/package_windows.py
      - scripts/windows_desktop_entry.py
      - scripts/verify_model.py
      - installers/version.txt
      - config/model-manifest.json
      - requirements-ui.txt

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-ui.txt pyinstaller==6.22.3
      - name: Build and smoke-test Windows package
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripts.package_windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CedexiaNexus-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
