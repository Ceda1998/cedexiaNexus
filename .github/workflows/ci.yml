name: Bootstrap checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Local inventory smoke check
        run: python scripts/doctor.py
      - name: Windows inventory smoke check
        if: runner.os == 'Windows'
        run: |
          python -c "from scripts.inventory_windows import collect_inventory; r = collect_inventory(); assert r['supported'] and r['os']['build'] != 'unknown' and r['cpu'] != 'unknown' and isinstance(r['ram_bytes'], int) and isinstance(r['free_physical_ram_bytes'], int)"
      - name: Whitespace check
        run: git diff --check

  desktop:
    name: Desktop demo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install UI dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Desktop interaction and bootstrap tests
        run: python -m unittest discover -s tests -v
      - name: Compile desktop sources
        run: python -m compileall -q nexus_ui scripts tests
